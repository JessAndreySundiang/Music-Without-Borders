version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # TypeScript 7 is blocked by typescript-eslint's peer range (<6.1.0).
    ignore:
      - dependency-name: "typescript"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      donation-api-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: composer
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      laravel-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # PHPUnit 13 requires PHP >= 8.4.1; the API image and CI use PHP 8.3.
    ignore:
      - dependency-name: "phpunit/phpunit"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
